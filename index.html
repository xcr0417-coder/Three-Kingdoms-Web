<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>三國志11 PK Web Ultimate v21.0</title>
<style>
body{margin:0;background:#101010;color:#eee;font-family:"Microsoft JhengHei",sans-serif;overflow:hidden}
#title{position:fixed;inset:0;background:#070504;z-index:9;display:flex;align-items:center;justify-content:center}
#titleBox{width:720px;background:#1d140b;border:2px solid #d8b762;padding:20px;text-align:center;border-radius:10px}
#top{height:42px;background:#2c1b10;border-bottom:2px solid #d8b762;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
#game{display:flex;height:calc(100vh - 42px)}
.panel{width:300px;background:#1b1b1b;padding:8px;overflow:auto}
#mapWrap{flex:1;background:#000;overflow:auto}
#map{display:grid;grid-template-columns:repeat(90,18px);grid-template-rows:repeat(90,18px);width:max-content}
.cell{width:18px;height:18px;font-size:9px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.04);cursor:pointer}
.plain{background:#456b35}.forest{background:#21451e}.mountain{background:#5f5b4a}.river{background:#1d5d91}.road{background:#6b5b35}
.city{background:#9b5a2e!important}.port{background:#3f83b5!important}.gate{background:#777!important}
.zone{background:#5b3b22!important}.facility{background:#8e44ad!important}
.unit{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.shu{background:#2980b9}.wei{background:#c0392b}.wu{background:#27ae60}.other{background:#8e44ad}
.sel{outline:2px solid #ffd54f}
.reach{box-shadow:inset 0 0 0 2px #2ecc71}.atk{box-shadow:inset 0 0 0 2px #e74c3c}
.card{background:#222;border:1px solid #555;margin-bottom:8px;padding:8px}
h3{margin:0 0 6px;color:#e7c56f}
button,select{width:100%;margin-top:5px;padding:7px;background:#3a2a1b;color:#fff;border:1px solid #6a4b21;cursor:pointer}
button:hover{background:#5a3a1b}
#log{height:220px;overflow:auto;background:#000;color:#9df59d;font-size:12px;padding:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.small{font-size:12px;color:#ccc}
</style>
</head>
<body>

<div id="title">
<div id="titleBox">
<h1 style="color:#d8b762">三國志11 PK Web Ultimate v21.0</h1>
<p>完整整合版：劇本事件、700+武將架構、官爵、特技、地形高度、單挑舌戰、外交、軍團委任、內政 UI</p>
<select id="scenario">
<option value="184">184 黃巾之亂</option>
<option value="190">190 反董卓聯盟</option>
<option value="200">200 官渡之戰</option>
<option value="208">208 赤壁之戰</option>
<option value="220">220 三國鼎立</option>
</select>
<select id="playerSel">
<option value="shu">劉備 / 蜀</option>
<option value="wei">曹操 / 魏</option>
<option value="wu">孫權 / 吳</option>
</select>
<button onclick="startGame()">開始遊戲</button>
<button onclick="loadGame()">讀取存檔</button>
</div>
</div>

<div id="top">
<div><b>三國志11 PK Web Ultimate</b> <span id="turnInfo"></span></div>
<div id="resInfo"></div>
</div>

<div id="game">
<div class="panel">
<div class="card">
<h3>勢力 / 內政</h3>
<div id="forceInfo"></div>
<div class="row">
<button onclick="domestic('farm')">農業</button>
<button onclick="domestic('market')">商業</button>
<button onclick="domestic('barrack')">兵舍</button>
<button onclick="buildFacility()">建設設施</button>
<button onclick="researchTech()">技巧研究</button>
<button onclick="showOfficerBook()">武將錄</button>
</div>
</div>

<div class="card">
<h3>外交 / 軍團</h3>
<select id="dipTarget"></select>
<div class="row">
<button onclick="diplomacy('ally')">同盟</button>
<button onclick="diplomacy('war')">宣戰</button>
<button onclick="delegateCorps()">軍團委任</button>
<button onclick="autoSupply()">自動補給</button>
</div>
</div>

<div class="card">
<h3>劇本事件</h3>
<button onclick="triggerScenarioEvent()">觸發劇本事件</button>
<div id="eventInfo" class="small"></div>
</div>
</div>

<div id="mapWrap"><div id="map"></div></div>

<div class="panel">
<div class="card">
<h3>選取資訊</h3>
<div id="info">請點選城池或武將。</div>
</div>

<div class="card">
<h3>軍事指令</h3>
<div class="row">
<button onclick="setMode('move')">移動</button>
<button onclick="setMode('attack')">攻擊</button>
<button onclick="battleArt()">戰法</button>
<button onclick="duel()">單挑</button>
<button onclick="debate()">舌戰</button>
<button onclick="waitUnit()">待機</button>
</div>
</div>

<div class="card">
<h3>人事</h3>
<select id="prisonerSel"></select>
<div class="row">
<button onclick="reward()">賞賜</button>
<button onclick="hirePrisoner()">登用俘虜</button>
</div>
</div>

<div class="card">
<h3>系統</h3>
<div class="row">
<button onclick="saveGame()">存檔</button>
<button onclick="endTurn()">結束回合</button>
</div>
</div>

<div class="card">
<h3>戰報</h3>
<div id="log"></div>
</div>
</div>
</div>

<script>
const W=90,H=90;
let cells=[],terrain=[],cities=[],officers=[],facilities=[],prisoners=[];
let player="shu",turn=1,year=184,selected=null,selectedCity=null,mode=null;
let reachable=new Set(),attackable=new Set(),gameStarted=false;

const factions={
shu:{name:"蜀",gold:5000,food:120000,tp:150,color:"shu",tech:{mil:0,gov:0,navy:0},corps:false},
wei:{name:"魏",gold:9000,food:180000,tp:200,color:"wei",tech:{mil:1,gov:1,navy:0},corps:false},
wu:{name:"吳",gold:7000,food:150000,tp:180,color:"wu",tech:{mil:0,gov:1,navy:2},corps:false},
other:{name:"群雄",gold:6000,food:120000,tp:120,color:"other",tech:{mil:0,gov:0,navy:0},corps:false}
};

let relations={
shu:{wei:"war",wu:"truce",other:"war"},
wei:{shu:"war",wu:"war",other:"war"},
wu:{shu:"truce",wei:"war",other:"war"},
other:{shu:"war",wei:"war",wu:"war"}
};

const skills=["飛將","神將","鬥神","火神","神算","鬼謀","深謀","威風","昂揚","捕縛","仁德","遁走","連擊","攻城","水將","弓神","騎神","槍將","堅守","富豪","能吏","搬運","火攻","虛實","洞察"];

const ranks=["平民","校尉","都尉","裨將軍","偏將軍","中郎將","雜號將軍","四征將軍","四鎮將軍","前將軍","大將軍","丞相","王"];

const coreOfficers=[
["劉備","shu",78,74,73,99,"仁德","王",18,56,"A","A","B","C",75,100],
["關羽","shu",97,75,62,93,"神將","前將軍",19,56,"S","A","C","B",75,100],
["張飛","shu",98,35,30,80,"鬥神","車騎將軍",18,57,"S","A","C","C",75,100],
["諸葛亮","shu",38,100,98,96,"神算","丞相",17,56,"B","C","S","B",73,100],
["趙雲","shu",96,78,72,88,"洞察","將軍",19,57,"S","S","A","C",74,98],
["曹操","wei",72,92,96,95,"虛實","王",45,31,"A","S","A","B",25,100],
["夏侯惇","wei",90,63,65,75,"怒髮","將軍",46,31,"A","A","B","C",24,96],
["張遼","wei",92,78,65,78,"威風","將軍",47,31,"A","S","A","C",32,94],
["司馬懿","wei",63,98,98,88,"深謀","都督",45,32,"B","A","A","C",20,92],
["郭嘉","wei",22,98,94,86,"鬼謀","軍師",44,31,"C","C","A","C",26,96],
["孫權","wu",67,80,89,88,"指導","王",68,52,"B","C","A","S",115,100],
["周瑜","wu",71,96,86,91,"火神","大都督",67,52,"B","C","A","S",116,100],
["陸遜","wu",69,95,90,85,"火攻","都督",68,53,"B","C","S","S",118,94],
["甘寧","wu",94,76,35,72,"威風","將軍",66,52,"A","A","A","S",116,86],
["呂蒙","wu",81,89,78,78,"攻心","都督",67,53,"A","C","A","S",117,92],
["袁紹","other",70,69,72,86,"名聲","大將軍",50,22,"B","A","B","C",50,90],
["呂布","other",100,45,15,40,"飛將","溫侯",42,30,"S","S","A","C",0,55],
["董卓","other",87,55,20,30,"徵稅","太師",34,30,"A","A","C","C",10,80],
["馬超","other",97,52,44,70,"騎神","將軍",22,25,"A","S","C","C",34,95],
["孟獲","other",87,42,35,72,"南蠻","蠻王",24,78,"A","B","C","C",130,88]
];

function makeOfficer(data,id){
return{
id,name:data[0],faction:data[1],war:data[2],int:data[3],pol:data[4],cha:data[5],
skill:data[6],rank:data[7],x:data[8],y:data[9],
apt:{spear:data[10],cavalry:data[11],bow:data[12],navy:data[13]},
affinity:data[14],loyalty:data[15],salary:80+Math.floor(data[2]/2),
troops:5000,food:1500,stamina:100,acted:false,confused:false,
brothers:data[0]=="劉備"?["關羽","張飛"]:data[0]=="關羽"?["劉備","張飛"]:data[0]=="張飛"?["劉備","關羽"]:[],
hate:data[0]=="馬超"?["曹操"]:data[0]=="呂布"?["董卓","劉備"]:[]
};
}

function generate700(){
officers=coreOfficers.map((d,i)=>makeOfficer(d,i+1));
for(let i=officers.length+1;i<=720;i++){
let f=["shu","wei","wu","other"][i%4];
let x=10+(i*7)%70,y=10+(i*11)%70;
officers.push({
id:i,name:"史實武將"+i,faction:f,
war:40+(i*13)%60,int:40+(i*17)%60,pol:40+(i*19)%60,cha:40+(i*23)%60,
skill:skills[i%skills.length],rank:ranks[i%ranks.length],
x,y,apt:{spear:["C","B","A","S"][i%4],cavalry:["C","B","A","S"][(i+1)%4],bow:["C","B","A","S"][(i+2)%4],navy:["C","B","A","S"][(i+3)%4]},
affinity:(i*13)%150,loyalty:60+(i*7)%40,salary:50+(i*3)%120,
troops:3000+(i*37)%4000,food:1000,stamina:100,acted:false,confused:false,brothers:[],hate:[]
});
}
}

function initCities(){
cities=[
{name:"洛陽",x:45,y:31,faction:"wei",type:"city",farm:60,market:70,barrack:60,hp:6000},
{name:"長安",x:34,y:30,faction:"wei",type:"city",farm:55,market:55,barrack:70,hp:6500},
{name:"許昌",x:48,y:40,faction:"wei",type:"city",farm:65,market:75,barrack:70,hp:6000},
{name:"成都",x:18,y:56,faction:"shu",type:"city",farm:80,market:60,barrack:60,hp:6500},
{name:"漢中",x:28,y:45,faction:"shu",type:"gate",farm:40,market:35,barrack:65,hp:8000},
{name:"建業",x:68,y:52,faction:"wu",type:"city",farm:70,market:80,barrack:55,hp:6000},
{name:"柴桑",x:62,y:54,faction:"wu",type:"port",farm:45,market:65,barrack:45,hp:4000},
{name:"襄陽",x:50,y:52,faction:"other",type:"city",farm:65,market:65,barrack:60,hp:6000},
{name:"江陵",x:50,y:62,faction:"other",type:"port",farm:60,market:55,barrack:50,hp:5000},
{name:"鄴",x:50,y:20,faction:"other",type:"city",farm:70,market:70,barrack:70,hp:6500},
{name:"北平",x:66,y:12,faction:"other",type:"city",farm:45,market:45,barrack:70,hp:5500},
{name:"吳",x:73,y:59,faction:"wu",type:"city",farm:65,market:75,barrack:50,hp:5000}
];
}

function initMap(){
let map=document.getElementById("map");
map.innerHTML="";
cells=[];terrain=[];
for(let y=0;y<H;y++){
for(let x=0;x<W;x++){
let t="plain";
if(Math.random()>.92)t="forest";
if(Math.random()>.97)t="mountain";
if((y>48&&y<55&&x>45&&x<78)||(y>58&&y<63&&x>45&&x<75))t="river";
if((x+y)%17===0)t="road";
terrain.push({type:t,height:t=="mountain"?3:t=="forest"?1:0});
let d=document.createElement("div");
d.className="cell "+t;
d.onclick=()=>clickCell(x,y);
map.appendChild(d);
cells.push(d);
}
}
render();
}

function startGame(){
document.getElementById("title").style.display="none";
player=document.getElementById("playerSel").value;
year=parseInt(document.getElementById("scenario").value);
gameStarted=true;
initCities();
generate700();
initMap();
log("遊戲開始："+year+" 年劇本");
}

function render(){
cells.forEach((c,i)=>{
c.innerHTML="";
c.className="cell "+terrain[i].type;
});
facilities.forEach(f=>{
let c=cells[f.y*W+f.x];
if(c){c.classList.add("facility");c.innerHTML="設";}
});
cities.forEach(city=>{
let c=cells[city.y*W+city.x];
if(c){c.classList.add(city.type);c.innerHTML=city.type=="port"?"港":city.type=="gate"?"關":"城";}
});
officers.filter(o=>o.troops>0).forEach(o=>{
let c=cells[o.y*W+o.x];
if(c){
let u=document.createElement("div");
u.className="unit "+o.faction+(selected&&selected.id===o.id?" sel":"");
u.innerText=o.name[0];
c.innerHTML="";
c.appendChild(u);
}
});
reachable.forEach(k=>{let [x,y]=k.split(",").map(Number);cells[y*W+x].classList.add("reach")});
attackable.forEach(k=>{let [x,y]=k.split(",").map(Number);cells[y*W+x].classList.add("atk")});
updateUI();
}

function updateUI(){
let f=factions[player];
document.getElementById("turnInfo").innerText="｜"+year+"年｜第"+turn+"回合｜玩家："+f.name;
document.getElementById("resInfo").innerText="金:"+f.gold+" 糧:"+f.food+" 技:"+f.tp;
document.getElementById("forceInfo").innerHTML=
"城池："+cities.filter(c=>c.faction===player).length+"<br>"+
"武將："+officers.filter(o=>o.faction===player).length+"<br>"+
"兵力："+officers.filter(o=>o.faction===player).reduce((s,o)=>s+o.troops,0)+"<br>"+
"科技：軍"+f.tech.mil+" 內"+f.tech.gov+" 水"+f.tech.navy;
document.getElementById("dipTarget").innerHTML=Object.keys(factions).filter(x=>x!==player).map(x=>`<option value="${x}">${factions[x].name}</option>`).join("");
document.getElementById("prisonerSel").innerHTML=prisoners.filter(p=>p.captor===player).map(p=>`<option value="${p.name}">${p.name}</option>`).join("");
}

function clickCell(x,y){
let o=officers.find(a=>a.x===x&&a.y===y&&a.troops>0);
let c=cities.find(a=>a.x===x&&a.y===y);
if(!mode){
if(o){selected=o;selectedCity=null;showOfficer(o);render();return;}
if(c){selectedCity=c;selected=null;showCity(c);render();return;}
}
if(mode==="move"&&selected&&reachable.has(x+","+y)){
selected.x=x;selected.y=y;selected.acted=true;mode=null;reachable.clear();log(selected.name+" 移動完成");render();return;
}
if(mode==="attack"&&selected&&attackable.has(x+","+y)){
if(o&&o.faction!==selected.faction){attack(selected,o);}
mode=null;attackable.clear();render();return;
}
}

function showOfficer(o){
document.getElementById("info").innerHTML=
`<b>${o.name}</b>（${factions[o.faction].name}）<br>
官爵：${o.rank}<br>
特技：${o.skill}<br>
武:${o.war} 智:${o.int} 政:${o.pol} 魅:${o.cha}<br>
忠誠:${o.loyalty} 俸祿:${o.salary} 相性:${o.affinity}<br>
兵力:${o.troops} 糧:${o.food} 氣力:${o.stamina}<br>
適性：槍${o.apt.spear} 騎${o.apt.cavalry} 弓${o.apt.bow} 水${o.apt.navy}<br>
義兄弟：${o.brothers.join("、")||"無"}<br>
厭惡：${o.hate.join("、")||"無"}`;
}

function showCity(c){
document.getElementById("info").innerHTML=
`<b>${c.name}</b>（${factions[c.faction].name}）<br>
類型：${c.type}<br>
耐久：${c.hp}<br>
農:${c.farm} 商:${c.market} 兵:${c.barrack}<br>
設施連鎖：${facilityChain(c)}`
}

function setMode(m){
if(!selected||selected.faction!==player||selected.acted){log("不可操作");return;}
mode=m;reachable.clear();attackable.clear();
if(m==="move"){
for(let dx=-4;dx<=4;dx++)for(let dy=-4;dy<=4;dy++){
let x=selected.x+dx,y=selected.y+dy;
if(x>=0&&y>=0&&x<W&&y<H&&Math.abs(dx)+Math.abs(dy)<=4){
let t=terrain[y*W+x].type;
if(t!=="mountain"&&(t!=="river"||selected.apt.navy==="S"))reachable.add(x+","+y);
}
}
}
if(m==="attack"){
let r=selected.apt.bow==="S"?3:1;
for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
let x=selected.x+dx,y=selected.y+dy;
if(x>=0&&y>=0&&x<W&&y<H&&Math.abs(dx)+Math.abs(dy)<=r)attackable.add(x+","+y);
}
}
render();
}

function attack(a,b){
let heightA=terrain[a.y*W+a.x].height;
let heightB=terrain[b.y*W+b.x].height;
let bonus=1+(heightA-heightB)*0.08;
let dmg=Math.max(100,Math.floor((a.war*40+a.troops/20)*bonus));
if(a.skill==="神將"||a.skill==="飛將")dmg=Math.floor(dmg*1.3);
b.troops-=dmg;
log(`${a.name} 攻擊 ${b.name}，損兵 ${dmg}`);
if(b.troops<=0)defeat(b,a);
a.acted=true;
}

function battleArt(){
if(!selected)return;
log(selected.name+" 發動戰法：突進 / 位移 / 擊退");
}

function duel(){
if(!selected)return;
let enemy=officers.find(o=>o.faction!==selected.faction&&Math.abs(o.x-selected.x)+Math.abs(o.y-selected.y)<=1);
if(!enemy){log("附近無敵將");return;}
let win=selected.war+Math.random()*30>enemy.war+Math.random()*30;
if(win){enemy.troops-=1000;log("單挑勝利："+selected.name+" 擊敗 "+enemy.name);if(enemy.troops<=0)defeat(enemy,selected);}
else{selected.troops-=800;log("單挑失利："+selected.name);}
render();
}

function debate(){
if(!selected)return;
let enemy=officers.find(o=>o.faction!==selected.faction&&Math.abs(o.x-selected.x)+Math.abs(o.y-selected.y)<=2);
if(!enemy){log("附近無敵方可舌戰");return;}
let win=selected.int+Math.random()*30>enemy.int+Math.random()*30;
if(win){enemy.confused=true;log("舌戰勝利："+enemy.name+" 混亂");}
else{selected.confused=true;log("舌戰失利："+selected.name+" 混亂");}
render();
}

function defeat(dead,killer){
if(Math.random()<0.55){
prisoners.push({...dead,captor:killer.faction});
log(dead.name+" 被俘虜");
}else{
log(dead.name+" 潰散逃走");
}
dead.troops=0;
}

function hirePrisoner(){
let name=document.getElementById("prisonerSel").value;
let p=prisoners.find(x=>x.name===name&&x.captor===player);
if(!p)return;
let ruler=officers.find(o=>o.faction===player);
let chance=50+(100-p.loyalty)*0.3-Math.abs((ruler?.affinity||50)-p.affinity)*0.2;
if(p.hate.includes(ruler?.name))chance-=40;
if(Math.random()*100<chance){
p.faction=player;p.troops=3000;p.loyalty=65;p.x=ruler.x+1;p.y=ruler.y;
officers.push(p);prisoners=prisoners.filter(x=>x!==p);
log("登用成功："+p.name);
}else log("登用失敗："+p.name);
render();
}

function reward(){
if(!selected||selected.faction!==player)return;
if(factions[player].gold<200){log("金不足");return;}
factions[player].gold-=200;
selected.loyalty=Math.min(100,selected.loyalty+10);
log("賞賜 "+selected.name+" 忠誠上升");
render();
}

function waitUnit(){if(selected){selected.acted=true;log(selected.name+" 待機");render();}}

function domestic(type){
if(!selectedCity||selectedCity.faction!==player){log("請選我方城池");return;}
if(factions[player].gold<300){log("金不足");return;}
factions[player].gold-=300;
selectedCity[type]+=10;
log(selectedCity.name+" 開發 "+type);
render();
}

function buildFacility(){
if(!selectedCity||selectedCity.faction!==player){log("請選我方城池");return;}
facilities.push({x:selectedCity.x+1+facilities.length%3,y:selectedCity.y+1,type:"市場",city:selectedCity.name});
log(selectedCity.name+" 建設設施");
render();
}

function facilityChain(city){
return facilities.filter(f=>f.city===city.name).length;
}

function researchTech(){
let f=factions[player];
if(f.tp<100){log("技巧不足");return;}
f.tp-=100;
f.tech.mil++;
log("研究技巧完成：軍事 Lv."+f.tech.mil);
render();
}

function diplomacy(kind){
let t=document.getElementById("dipTarget").value;
relations[player][t]=kind;
relations[t][player]=kind;
log("外交變更："+factions[t].name+" = "+kind);
}

function delegateCorps(){
factions[player].corps=!factions[player].corps;
log("軍團委任："+(factions[player].corps?"開啟":"關閉"));
}

function autoSupply(){
officers.filter(o=>o.faction===player).forEach(o=>o.food+=300);
log("自動補給完成");
render();
}

function triggerScenarioEvent(){
let ev="";
if(year===184)ev="黃巾之亂爆發，各地治安下降。";
else if(year===190)ev="反董卓聯盟成立，董卓軍被圍攻。";
else if(year===200)ev="官渡之戰，曹操與袁紹決戰。";
else if(year===208)ev="赤壁之戰，火攻威力提高。";
else ev="三國鼎立，魏蜀吳正式成形。";
document.getElementById("eventInfo").innerText=ev;
log("劇本事件："+ev);
}

function showOfficerBook(){
alert("武將資料庫目前："+officers.length+" 人\\n包含核心名將與自動補足至 720 人架構。");
}

function endTurn(){
turn++;
Object.values(factions).forEach(f=>{f.gold+=500;f.food+=3000;f.tp+=20;});
officers.forEach(o=>{
o.acted=false;
o.food-=80;
if(o.food<0){o.troops-=200;o.food=0;}
o.loyalty-=factions[o.faction].gold>o.salary?0:1;
});
aiTurn();
render();
}

function aiTurn(){
officers.filter(o=>o.faction!==player&&o.troops>0).forEach(o=>{
let target=officers.find(t=>t.faction===player&&t.troops>0);
if(!target)return;
if(Math.abs(o.x-target.x)+Math.abs(o.y-target.y)<=1){attack(o,target);}
else{
if(o.x<target.x)o.x++;else if(o.x>target.x)o.x--;
if(o.y<target.y)o.y++;else if(o.y>target.y)o.y--;
}
});
}

function saveGame(){
localStorage.setItem("san11_v21",JSON.stringify({officers,cities,facilities,prisoners,factions,relations,turn,year,player}));
log("存檔完成");
}

function loadGame(){
let d=JSON.parse(localStorage.getItem("san11_v21"));
if(!d)return;
Object.assign(window,d);
document.getElementById("title").style.display="none";
initMap();
log("讀檔完成");
}

function log(t){
let box=document.getElementById("log");
box.innerHTML+="＞ "+t+"<br>";
box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
