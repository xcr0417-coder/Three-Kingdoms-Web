<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>三國志11 Web 完整整合版</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:Microsoft JhengHei}

#topbar{
height:40px;background:#222;
display:flex;justify-content:space-around;align-items:center;
}

#game{display:flex}

#map{
width:500px;height:500px;
display:grid;
grid-template-columns:repeat(50,10px);
}

.cell{width:10px;height:10px;font-size:8px;text-align:center}

.plain{background:#2f7d32}
.forest{background:#1f6f2f}
.mountain{background:#666}
.river{background:#1f4fff}

.city{box-shadow:inset 0 0 0 2px #ffd54f}
.unit{background:#000!important}
.enemy{background:#b71c1c!important}
.selected{outline:1px solid #fff}

#side{width:260px;background:#1a1a1a;padding:10px}

button,select{
width:100%;
margin-top:5px;
padding:6px;
background:#333;
color:#fff;
border:none;
}

.skill{animation:flash 0.3s 3}
@keyframes flash{0%{opacity:1}100%{opacity:0.2}}
</style>
</head>

<body>

<div id="topbar">
<span id="turn">回合:1</span>
<span id="faction">勢力:劉備</span>
<span id="modeText">模式:待機</span>
</div>

<div id="game">
<div id="map"></div>

<div id="side">
<div id="panel">選擇單位</div>

<button onclick="setMode('move')">移動</button>
<button onclick="setMode('attack')">攻擊 / 戰法</button>

<select id="formationSelect" onchange="changeFormation()">
<option value="normal">普通陣</option>
<option value="square">方陣：防禦↑</option>
<option value="wedge">鋒矢：騎兵↑</option>
<option value="arrow">雁行：弓兵↑</option>
</select>

<hr>

<button onclick="developCity()">開發</button>
<button onclick="recruit()">招募</button>

<button onclick="loadScenario('red')">赤壁劇本</button>

<button onclick="saveGame()">存檔</button>
<button onclick="loadGame()">讀檔</button>

<button onclick="endTurn()">結束回合</button>
</div>
</div>

<script>

/* ===== 基礎資料 ===== */

const SIZE=50;

let units=[],cities=[],terrain=[];
let selected=null,mode=null;

let turn=1;
let playerFaction="劉備";

/* 頭像 */
const portrait={
"劉備":"https://i.imgur.com/1X1.jpg",
"關羽":"https://i.imgur.com/2X2.jpg",
"張飛":"https://i.imgur.com/3X3.jpg",
"諸葛亮":"https://i.imgur.com/4X4.jpg",
"曹操":"https://i.imgur.com/5X5.jpg",
"孫權":"https://i.imgur.com/6X6.jpg",
"周瑜":"https://i.imgur.com/6X6.jpg"
};

/* ===== 初始化 ===== */

function init(){
createMap();
genTerrain();

/* 城市 */
createCity(10,30,"成都","劉備");
createCity(20,20,"洛陽","曹操");
createCity(35,35,"建業","孫權");
createCity(25,22,"許昌","曹操");

/* 武將 */
units.push(gen("劉備","劉備",10,30,"infantry"));
units.push(gen("關羽","劉備",11,30,"cavalry"));
units.push(gen("張飛","劉備",10,31,"cavalry"));
units.push(gen("曹操","曹操",20,20,"infantry"));
units.push(gen("孫權","孫權",35,35,"archer"));

/* 補滿200 */
for(let i=0;i<195;i++){
let faction=["劉備","曹操","孫權"][Math.random()*3|0];
units.push({
name:"武將"+i,
faction,
x:Math.random()*50|0,
y:Math.random()*50|0,
hp:1500,
war:50+Math.random()*50,
int:50+Math.random()*50,
lead:50+Math.random()*50,
portrait:"https://i.imgur.com/default.jpg",
skill:["火計","連擊","鬼謀"][Math.random()*3|0],
type:["infantry","cavalry","archer"][Math.random()*3|0],
formation:"normal"
});
}

render();
}

/* ===== 武將 ===== */

function gen(name,faction,x=10,y=10,type="infantry"){
return{
name,
faction,
x,y,
hp:2000,
war:80,
int:80,
lead:80,
portrait:portrait[name]||"https://i.imgur.com/default.jpg",
skill:["火計","連擊","鬼謀"][Math.random()*3|0],
type,
formation:"normal"
};
}

/* ===== 地圖與地形 ===== */

function createMap(){
let map=document.getElementById("map");
map.innerHTML="";
for(let i=0;i<SIZE*SIZE;i++){
let d=document.createElement("div");
d.className="cell plain";
d.onclick=()=>click(i%50,(i/50)|0);
map.appendChild(d);
}
}

function genTerrain(){
terrain=[];
for(let y=0;y<SIZE;y++){
for(let x=0;x<SIZE;x++){
let r=Math.random();
let t="plain";

if(r>0.86)t="mountain";
else if(r>0.72)t="forest";
else if(r>0.62)t="river";

terrain[y*SIZE+x]=t;
}
}
}

function getTerrain(x,y){
if(x<0||y<0||x>=SIZE||y>=SIZE)return "mountain";
return terrain[y*SIZE+x]||"plain";
}

function canMoveTo(x,y){
let t=getTerrain(x,y);
if(t==="mountain")return false;
if(t==="river")return false;
return true;
}

/* ===== 城市 ===== */

function createCity(x,y,name,owner){
cities.push({x,y,name,owner,hp:3000,gold:500,food:500});
}

/* ===== 點擊 ===== */

function click(x,y){

let u=units.findIndex(v=>v.x===x&&v.y===y);

if(u!==-1){
selected=u;
showUnit();
render();
return;
}

let unit=units[selected];
if(!unit)return;

if(mode==="move"){
if(!canMoveTo(x,y)){
panel.innerHTML+="<br>此地形不可移動";
return;
}
unit.x=x;
unit.y=y;
mode=null;
}

if(mode==="attack"){
let t=units.find(v=>v.x===x&&v.y===y&&v.faction!==unit.faction);
if(t)battle(unit,t,x,y);
mode=null;
}

removeDead();
render();
showUnit();
}

/* ===== 戰法與地形戰鬥 ===== */

function calcFireRate(x,y){
let t=getTerrain(x,y);

if(t==="forest")return 2.0;
if(t==="river")return 0;
if(t==="mountain")return 0.8;

return 1.0;
}

function battle(a,t,x,y){
let terrainType=getTerrain(x,y);
let dmg=a.war;

/* 兵種 */
if(a.type==="cavalry"){
if(terrainType==="river"){
panel.innerHTML+="<br>🌊 河流地形，騎兵衝鋒失敗";
return;
}
dmg*=1.4;
if(terrainType==="forest")dmg*=0.9;
if(terrainType==="mountain")dmg*=0.7;
if(a.formation==="wedge")dmg*=1.3;
}

if(a.type==="archer"){
dmg*=1.1;
if(terrainType==="forest")dmg*=1.2;
if(terrainType==="mountain")dmg*=1.1;
if(a.formation==="arrow")dmg*=1.3;
}

if(a.type==="infantry"){
dmg*=1.0;
}

/* 陣型 */
if(a.formation==="square")dmg*=0.85;

/* 技能 */
if(a.skill==="火計"){
let rate=calcFireRate(x,y);
if(rate===0){
panel.innerHTML+="<br>🌊 水域火計無效";
return;
}
dmg=500*rate;
fire(x,y);
panel.innerHTML+="<br>🔥 火計發動，倍率："+rate;
}

if(a.skill==="連擊"){
dmg+=600;
}

if(a.skill==="鬼謀"){
dmg+=300;
a.hp+=200;
}

/* 被攻擊方防禦陣型 */
if(t.formation==="square")dmg*=0.7;

t.hp-=Math.floor(dmg);

panel.innerHTML+="<br>"+a.name+" 對 "+t.name+" 造成 "+Math.floor(dmg)+" 傷害";
}

/* 火特效 */
function fire(x,y){
let idx=y*SIZE+x;
let el=document.querySelectorAll(".cell")[idx];
if(!el)return;
el.classList.add("skill");
setTimeout(()=>el.classList.remove("skill"),500);
}

function removeDead(){
units=units.filter(u=>u.hp>0);
}

/* ===== UI ===== */

function setMode(m){
mode=m;
document.getElementById("modeText").innerText="模式:"+m;
}

function changeFormation(){
if(selected===null)return;
let u=units[selected];
u.formation=document.getElementById("formationSelect").value;
showUnit();
}

function showUnit(){
let u=units[selected];
if(!u)return;
document.getElementById("formationSelect").value=u.formation||"normal";

panel.innerHTML=`
<img src="${u.portrait}" width="60"><br>
${u.name}<br>
勢力:${u.faction}<br>
兵力:${Math.floor(u.hp)}<br>
武力:${Math.floor(u.war)}<br>
智力:${Math.floor(u.int)}<br>
統率:${Math.floor(u.lead)}<br>
兵種:${unitTypeName(u.type)}<br>
陣型:${formationName(u.formation)}<br>
技能:${u.skill}<br>
所在地形:${terrainName(getTerrain(u.x,u.y))}
`;
}

function unitTypeName(t){
return {infantry:"步兵",cavalry:"騎兵",archer:"弓兵"}[t]||t;
}

function formationName(f){
return {normal:"普通陣",square:"方陣",wedge:"鋒矢",arrow:"雁行"}[f]||f;
}

function terrainName(t){
return {plain:"平原",forest:"森林",mountain:"山地",river:"河流"}[t]||t;
}

/* ===== 城市內政 ===== */

function developCity(){
let c=cities.find(c=>c.owner===playerFaction) || cities[0];
c.gold+=200;
c.food+=200;
panel.innerHTML=`${c.name} 開發完成<br>金:${c.gold}<br>糧:${c.food}`;
}

function recruit(){
let city=cities.find(c=>c.owner===playerFaction) || cities[0];
units.push({
name:"新武將"+Math.floor(Math.random()*999),
faction:playerFaction,
x:city.x,
y:city.y,
hp:1600,
war:60+Math.random()*30,
int:60+Math.random()*30,
lead:60+Math.random()*30,
portrait:"https://i.imgur.com/default.jpg",
skill:["火計","連擊","鬼謀"][Math.random()*3|0],
type:["infantry","cavalry","archer"][Math.random()*3|0],
formation:"normal"
});
alert("招募成功");
render();
}

/* ===== 劇本 ===== */

function loadScenario(type){

if(type==="red"){
units=[];
cities=[];
selected=null;
mode=null;

playerFaction="孫權";

createCity(35,35,"建業","孫權");
createCity(20,20,"洛陽","曹操");
createCity(12,30,"江夏","劉備");

units.push(gen("周瑜","孫權",35,35,"archer"));
units.push(gen("諸葛亮","劉備",12,30,"infantry"));
units.push(gen("曹操","曹操",20,20,"cavalry"));

alert("赤壁之戰開始🔥");
}

render();
}

/* ===== 存檔 ===== */

function saveGame(){
localStorage.setItem("s11",JSON.stringify({units,cities,terrain,turn,playerFaction}));
alert("存檔完成");
}

function loadGame(){
let d=JSON.parse(localStorage.getItem("s11"));
if(!d)return;
units=d.units;
cities=d.cities;
terrain=d.terrain||terrain;
turn=d.turn;
playerFaction=d.playerFaction||playerFaction;
selected=null;
mode=null;
render();
}

/* ===== 回合 ===== */

function endTurn(){
turn++;

units.forEach(u=>{
if(u.faction!==playerFaction){
let target=units.find(v=>v.faction===playerFaction);
if(!target)return;

let nx=u.x+Math.sign(target.x-u.x);
let ny=u.y+Math.sign(target.y-u.y);

if(canMoveTo(nx,ny)){
u.x=nx;
u.y=ny;
}

if(Math.abs(u.x-target.x)<=1&&Math.abs(u.y-target.y)<=1){
battle(u,target,target.x,target.y);
}
}
});

removeDead();
render();
}

/* ===== 渲染 ===== */

function render(){

let cells=document.querySelectorAll(".cell");

cells.forEach((c,i)=>{
let x=i%SIZE;
let y=(i/SIZE)|0;
let t=getTerrain(x,y);

c.className="cell "+t;
c.textContent="";
});

/* 城市 */
cities.forEach(c=>{
let i=c.y*SIZE+c.x;
if(cells[i]){
cells[i].classList.add("city");
cells[i].textContent="🏯";
}
});

/* 單位 */
units.forEach((u,i)=>{
let idx=u.y*SIZE+u.x;
if(!cells[idx])return;
cells[idx].textContent="⚔️";
cells[idx].classList.add(u.faction===playerFaction?"unit":"enemy");
if(i===selected)cells[idx].classList.add("selected");
});

document.getElementById("turn").innerText="回合:"+turn;
document.getElementById("faction").innerText="勢力:"+playerFaction;
document.getElementById("modeText").innerText="模式:"+(mode||"待機");
}

/* ===== 啟動 ===== */

init();

</script>
</body>
</html>
