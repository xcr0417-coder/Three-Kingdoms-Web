<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三國志11 Web PK v14 完整版</title>
<style>
:root{--gold:#d4af37;--bg:#111;--panel:#1b1b1b;--line:#6b5520}
body{margin:0;background:#111;color:#fff;font-family:"Microsoft JhengHei", sans-serif; overflow: hidden;}
#titleScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#titleScreen button { width: 200px; font-size: 18px; padding: 15px; cursor: pointer; }
#gameScreen { display: none; height: 100vh; flex-direction: column; }
.topbar{padding:12px;background:#111;border-bottom:2px solid var(--gold);display:flex;gap:16px;flex-wrap:wrap; font-weight:bold;}
.layout{display:flex;flex-grow:1; overflow:hidden;}
.panel{width:320px;background:var(--panel);padding:12px;overflow:auto;border-right:1px solid var(--line); display:flex; flex-direction:column;}
.map{flex:1;padding:12px;background:#161616;display:flex;flex-direction:column; overflow:auto;}
.grid{display:grid;grid-template-columns:repeat(20,64px);grid-template-rows:repeat(12,64px);gap:4px; width:fit-content;}
.cell{width:64px;height:64px;border:1px solid #333;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:#2f4f2f; font-size:12px;}
button{width:100%;padding:10px;margin:4px 0;background:#333;color:#fff;border:1px solid var(--gold); cursor:pointer;}
button:hover { background: #555; }
.hero,.card{background:#222;padding:8px;margin:6px 0;border:1px solid #444; cursor:pointer;}
.hero:hover { border-color: var(--gold); }
.log{height:220px;background:#000;overflow:auto;padding:10px;margin-top:10px; border:1px solid #333; font-size:13px; color:#2ecc71;}
.section{color:var(--gold);font-weight:bold;margin:8px 0; border-bottom:1px solid var(--line); padding-bottom:5px;}
</style>
</head>
<body>

<div id="titleScreen">
    <h1 style="color:#d4af37;font-size:48px">三國志11 Web PK</h1>
    <button id="startBtn">開始遊戲</button>
    <button onclick="toggleScenario()">劇本選單</button>
    <button onclick="toggleSave()">存檔管理</button>
    <div id="scenarioPanel" class="card" style="display:none; margin-top:20px; width:200px;"></div>
    <div id="savePanel" class="card" style="display:none; margin-top:20px; width:200px;"></div>
</div>

<div id="gameScreen">
    <div class="topbar">
        <span>回合: <span id="turn">1</span></span>
        <span>年份: <span id="year">184</span></span>
        <span style="color:#f1c40f;">金: <span id="gold">3000</span></span>
        <span style="color:#2ecc71;">糧: <span id="food">10000</span></span>
        <span>名聲: <span id="rep">50</span></span>
        <span>國號: <span id="kingdom">漢</span></span>
    </div>

    <div class="layout">
        <div class="panel">
            <div class="section">武將一覽</div>
            <div id="heroList" style="flex-grow:1; overflow-y:auto;"></div>
            <button style="background:#27ae60; font-size:16px; padding:15px;" onclick="endTurn()">⏳ 結束回合</button>
        </div>

        <div class="map">
            <div id="cityPanel" class="card" style="display:none; position:absolute; z-index:100; background:rgba(0,0,0,0.9);"></div>
            <div id="map" class="grid"></div>
            <div id="log" class="log"></div>
        </div>

        <div class="panel">
            <div class="section">軍略指令</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button onclick="recruitTroops()">徵兵</button>
                <button onclick="trainTroops()">訓練</button>
                <button onclick="patrolCity()">巡察</button>
                <button onclick="rewardHero()">賞賜</button>
                <button onclick="hireHero()">登用</button>
                <button onclick="triggerEvent()">事件</button>
            </div>
            
            <div class="section" style="margin-top:15px;">外交計略</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button onclick="spreadRumor()">流言</button>
                <button onclick="sowDiscord()">離間</button>
                <button onclick="makeAlliance()">同盟談判</button>
                <button onclick="sendTribute()">朝貢談判</button>
                <button onclick="exchangeHostage()" style="grid-column:span 2;">人質談判</button>
            </div>

            <div class="section" style="margin-top:15px;">部隊行動</div>
            <div id="unitDetail" class="card" style="text-align:center; color:#bdc3c7;">未選擇部隊</div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px;">
                <button style="background:#2980b9;" onclick="setMode('move')">移動</button>
                <button style="background:#c0392b;" onclick="setMode('attack')">攻擊</button>
                <button style="background:#8e44ad;" onclick="setMode('strategy')">計略</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- 資料設定 ---
const HEROES=[
    {name:'劉備',war:78,int:88,pol:82,skill:'仁德',loyalty:100,ambition:40,personality:'仁君',age:32,health:100,lifespan:68,relations:{brothers:['關羽','張飛'],spouse:null,enemies:['曹操']}},
    {name:'關羽',war:98,int:75,pol:62,skill:'神將',loyalty:100,ambition:30,personality:'忠義',age:31,health:100,lifespan:60,relations:{brothers:['劉備','張飛'],spouse:null,enemies:[]}},
    {name:'張飛',war:99,int:35,pol:30,skill:'鬥神',loyalty:95,ambition:35,personality:'暴烈',age:30,health:100,lifespan:55,relations:{brothers:['劉備','關羽'],spouse:null,enemies:[]}},
    {name:'諸葛亮',war:38,int:100,pol:98,skill:'神算',loyalty:100,ambition:20,personality:'謹慎',age:27,health:100,lifespan:54,relations:{brothers:[],spouse:null,enemies:[]}}
];

const GAME={
    selected:null,
    mode:'idle',
    currentFaction:'蜀',
    tutorialStep:0,
    officials:[],
    prisoners:[],
    factions:[
        {name:'蜀',color:'green',leader:'劉備',relation:{}},
        {name:'魏',color:'blue',leader:'曹操',relation:{}},
        {name:'吳',color:'red',leader:'孫權',relation:{}}
    ],
    turn:1, year:184, gold:3000, food:10000, reputation:50, kingdom:{name:'漢'},
    cities:[
        {name:'成都',owner:'蜀',x:3,y:3,hp:10000,agriculture:50,commerce:50,people:70},
        {name:'許昌',owner:'魏',x:12,y:4,hp:10000,agriculture:50,commerce:50,people:70},
        {name:'建業',owner:'吳',x:16,y:8,hp:10000,agriculture:50,commerce:50,people:70},
        {name:'漢中',owner:'蜀',x:8,y:6,hp:8000,agriculture:50,commerce:50,people:70}
    ],
    units:[]
};

// --- 初始化與啟動 ---
function startGame() {
    document.getElementById('titleScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    init();
    startPlayerTurn();
    log('遊戲開始，進入戰場。');
}

function init(){
    GAME.units=[];
    HEROES.forEach((h,i)=>{
        GAME.units.push({hero:h, faction:'蜀', x:3+i, y:3, troops:3000, morale:100, food:3000});
    });
    GAME.units.push({hero:{name:'夏侯惇',war:92,int:65}, faction:'魏', x:12, y:4, troops:3000, morale:100, food:3000});
    GAME.units.push({hero:{name:'周瑜',war:80,int:96}, faction:'吳', x:16, y:8, troops:3000, morale:100, food:3000});
    renderHeroes();
    drawMap();
    updateUI();
}

// --- 介面與地圖 ---
function renderHeroes(){
    const box=document.getElementById('heroList');
    box.innerHTML='';
    HEROES.forEach((h,i)=>{
        const div=document.createElement('div');
        div.className='hero';
        div.innerHTML=`<b>${h.name}</b><br>武:${h.war} 智:${h.int} 政:${h.pol}<br>★${h.skill}`;
        div.onclick=()=>selectUnit(i);
        box.appendChild(div);
    });
}

function selectUnit(i){
    GAME.selected=i;
    const u=GAME.units[i];
    document.getElementById('unitDetail').innerHTML=`
    <b style="color:var(--gold); font-size:16px;">${u.hero.name}</b><br>
    兵力:${u.troops} | 士氣:${u.morale} | 糧食:${u.food}`;
    log('選擇 '+u.hero.name);
}

function terrain(x,y){
    const list=['平原','森林','山地','河流'];
    return list[(x+y)%4];
}

function drawMap(){
    const map=document.getElementById('map');
    map.innerHTML='';
    for(let y=0;y<12;y++){
        for(let x=0;x<20;x++){
            const cell=document.createElement('div');
            cell.className='cell';
            const city=GAME.cities.find(c=>c.x===x&&c.y===y);
            const unit=GAME.units.find(u=>u.x===x&&u.y===y);
            
            if(city){
                const ownerMark = city.owner==='蜀'?'🟢':city.owner==='魏'?'🔵':'🔴';
                cell.style.border='2px solid '+(city.owner==='蜀'?'green':city.owner==='魏'?'blue':'red');
                cell.innerHTML=ownerMark+'🏯<br>'+city.name;
                cell.onclick=()=>openCity(city);
            }else if(unit){
                cell.innerHTML='⚔<br>'+unit.hero.name;
                cell.style.color = unit.faction==='蜀'?'#2ecc71':unit.faction==='魏'?'#3498db':'#e74c3c';
                cell.onclick=()=>mapClick(x,y);
            }else{
                cell.innerText=terrain(x,y);
                cell.onclick=()=>mapClick(x,y);
            }
            map.appendChild(cell);
        }
    }
}

function openCity(city){
    const panel=document.getElementById('cityPanel');
    panel.style.display='block';
    panel.innerHTML=`
    <b style="color:var(--gold); font-size:18px;">${city.name}</b><br>
    耐久:${city.hp}<br>農業:${city.agriculture}<br>
    商業:${city.commerce}<br>民心:${city.people}<br>
    <button onclick="document.getElementById('cityPanel').style.display='none'" style="margin-top:10px;">關閉</button>`;
}

function mapClick(x,y){
    if(GAME.selected===null) return;
    const myUnit=GAME.units[GAME.selected];
    const enemy=GAME.units.find((u,i)=>u.x===x&&u.y===y&&i!==GAME.selected);

    if(GAME.mode==='move'){
        if(!enemy && !GAME.cities.find(c=>c.x===x&&c.y===y)){
            myUnit.x=x; myUnit.y=y;
            log(myUnit.hero.name+' 移動完成');
        } else {
            log('目標地點已有部隊或城池！');
        }
    }

    if(GAME.mode==='attack' && enemy){
        battle(myUnit,enemy);
    }
    
    GAME.mode='idle';
    drawMap();
    updateUI();
}

function setMode(mode){
    if(GAME.selected === null) { log('請先從左側選擇武將部隊！'); return; }
    GAME.mode=mode;
    log('切換模式：'+mode+' (請點擊地圖目標)');
}

// --- 內政與計略指令 ---
function recruitTroops(){
    if(GAME.selected===null) return log('請先選擇武將');
    if(GAME.gold<300) return log('金錢不足');
    let unit=GAME.units[GAME.selected];
    unit.troops+=500; GAME.gold-=300;
    log(unit.hero.name+' 徵兵 +500'); updateUI(); selectUnit(GAME.selected);
}

function trainTroops(){
    if(GAME.selected===null) return log('請先選擇武將');
    let unit=GAME.units[GAME.selected];
    unit.morale+=10;
    log(unit.hero.name+' 訓練完成，士氣上升'); selectUnit(GAME.selected);
}

function patrolCity(){
    let city=GAME.cities[0]; city.people+=5;
    log(city.name+' 巡察完成，民心提升');
}

function rewardHero(){
    if(GAME.selected===null) return log('請先選擇武將');
    if(GAME.gold<200) return log('金錢不足');
    GAME.gold-=200;
    log(GAME.units[GAME.selected].hero.name+' 獲得賞賜'); updateUI();
}

function hireHero(){
    const newHero={name:'徐庶',war:60,int:92,pol:80,skill:'智將'};
    if(!HEROES.find(h=>h.name==='徐庶')) {
        HEROES.push(newHero);
        GAME.units.push({hero:newHero,faction:'蜀',x:4,y:4,troops:2000,morale:80,food:2000});
        renderHeroes(); drawMap();
        log('成功登用 徐庶');
    } else {
        log('無在野武將可登用');
    }
}

function spreadRumor(){
    let enemy=GAME.units.find(u=>u.faction!=='蜀');
    if(enemy){ enemy.morale-=15; log('成功散播流言，敵軍士氣下降'); }
}

function sowDiscord(){
    let enemy=GAME.units.find(u=>u.faction!=='蜀');
    if(enemy){ enemy.troops-=200; log('成功離間敵軍，敵軍兵力減少'); }
}

function makeAlliance(){ log('派出使者前往魏國進行同盟談判...'); }
function sendTribute(){ 
    if(GAME.gold>=500) { GAME.gold-=500; log('送出朝貢，外交關係改善'); updateUI(); }
    else { log('金錢不足以朝貢'); }
}
function exchangeHostage(){ GAME.prisoners.push('外交人質'); log('交換人質完成'); }

// --- 戰鬥與事件 ---
function battle(attacker,defender){
    if(attacker.faction===defender.faction){ log('不能攻擊友軍'); return; }
    let atk=Math.floor(attacker.hero.war*10*Math.random());
    let def=Math.floor(defender.hero.war*8*Math.random());
    let damage=Math.max(100,atk-def);

    defender.troops-=damage;
    log(`⚔️ ${attacker.hero.name} 攻擊 ${defender.hero.name}，造成 ${damage} 傷害`);

    if(defender.troops<=0){
        log(`💀 ${defender.hero.name} 部隊潰滅`);
        GAME.units=GAME.units.filter(u=>u!==defender);
        GAME.selected = null; document.getElementById('unitDetail').innerHTML="未選擇部隊";
    }
}

function triggerEvent(){
    const storyEvents=['桃園結義','三顧茅廬','官渡之戰','赤壁之戰','空城計'];
    const event=storyEvents[Math.floor(Math.random()*storyEvents.length)];
    log('📜 劇情事件觸發：'+event);
}

// --- 回合與系統 ---
function endTurn(){
    log('--- 玩家回合結束 ---');
    aiTurn();
    
    GAME.turn++; GAME.year++;
    GAME.gold+=500; GAME.food+=800;

    GAME.units.forEach(u=>{
        u.food-=100;
        if(u.food<=0){ u.troops-=100; log('⚠️ '+u.hero.name+' 缺糧損兵'); }
    });

    updateUI(); drawMap();
    log(`--- 第 ${GAME.turn} 回合開始 ---`);
    GAME.selected = null; document.getElementById('unitDetail').innerHTML="未選擇部隊";
}

function aiTurn(){
    GAME.units.forEach((u)=>{
        if(u.faction!=='蜀'){
            let target=GAME.cities.find(c=>c.owner!==(u.faction));
            if(target){
                u.x += target.x>u.x?1:(target.x<u.x?-1:0);
                u.y += target.y>u.y?1:(target.y<u.y?-1:0);
            }
        }
    });
    log('🤖 敵方勢力行動完成');
}

function startPlayerTurn(){
    GAME.mode='idle';
    log('輪到 '+GAME.currentFaction+' 行動');
    if(GAME.tutorialStep === 0) {
        alert('歡迎進入遊戲！\n1. 點擊左側武將選擇部隊。\n2. 點擊右側【移動】或【攻擊】。\n3. 點擊地圖目標執行。\n4. 完成後按【結束回合】。');
        GAME.tutorialStep++;
    }
}

function updateUI(){
    document.getElementById('turn').innerText=GAME.turn;
    document.getElementById('year').innerText=GAME.year;
    document.getElementById('gold').innerText=GAME.gold;
    document.getElementById('food').innerText=GAME.food;
    document.getElementById('rep').innerText=GAME.reputation;
    document.getElementById('kingdom').innerText=GAME.kingdom.name;
}

function log(msg){
    const box=document.getElementById('log');
    box.innerHTML+=`<div>> ${msg}</div>`;
    box.scrollTop=box.scrollHeight;
}

function toggleScenario(){
    const p=document.getElementById('scenarioPanel');
    p.style.display=p.style.display==='none'?'block':'none';
    p.innerHTML=`
    <button onclick="log('載入劇本：黃巾之亂')">黃巾之亂</button>
    <button onclick="log('載入劇本：赤壁之戰')">赤壁之戰</button>`;
}

function toggleSave(){
    const p=document.getElementById('savePanel');
    p.style.display=p.style.display==='none'?'block':'none';
    p.innerHTML=`
    <button onclick="log('存檔完成')">儲存進度</button>
    <button onclick="log('讀檔完成')">載入進度</button>`;
}

// 綁定開始按鈕
document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('startBtn');
    if (btn) {
        btn.addEventListener('click', startGame);
    }
});
</script>
</body>
</html>
