<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>三國志11 Web 威力加強版</title>
<style>
body{margin:0;background:#090604;color:#f2e6c8;font-family:Microsoft JhengHei,Arial;overflow:hidden}
#title{position:fixed;inset:0;background:radial-gradient(circle,#3b2b16,#090604 70%);z-index:9;display:flex;align-items:center;justify-content:center}
#box{width:560px;border:3px solid #d6b45a;background:#17100a;padding:22px;border-radius:12px;text-align:center}
h1{color:#d6b45a;margin:4px}
#top{height:46px;background:linear-gradient(#3a2b18,#120d08);display:flex;justify-content:space-around;align-items:center;border-bottom:2px solid #d6b45a;font-weight:bold}
#game{display:flex;height:calc(100vh - 46px)}
#l,#r{width:320px;background:#17100a;padding:10px;overflow:auto}
#l{border-right:2px solid #6f5426}
#r{border-left:2px solid #6f5426}
#wrap{flex:1;background:#050403;overflow:auto;display:flex;align-items:center;justify-content:center}
#map{width:760px;height:760px;display:grid;grid-template-columns:repeat(76,10px);border:3px solid #d6b45a;background:#000;user-select:none}
.c{width:10px;height:10px;font-size:8px;line-height:10px;text-align:center;box-sizing:border-box;cursor:pointer}
.c:hover{filter:brightness(1.25)}
.plain{background:#476c38}.forest{background:#28512d}.mountain{background:#665f50}.river{background:#2c5676}.road{background:#7b6a40}
.city{background:#9c7a2f;box-shadow:inset 0 0 0 2px #f4d36b}.gate{background:#6b4f2c;box-shadow:inset 0 0 0 2px #c89b3c}.port{background:#315f7c;box-shadow:inset 0 0 0 2px #b9e4ff}
.zone{background:#4b3d25;box-shadow:inset 0 0 0 1px #d6b45a}.fac{background:#5a3d2e;box-shadow:inset 0 0 0 1px #f2c86b}
.me{background:#2d6f8a!important;color:white}.enemy{background:#813131!important;color:white}.neutral{background:#6b5a38!important;color:white}
.sel{outline:2px solid #fff176}.done{filter:grayscale(100%) opacity(.55)}
.reach{box-shadow:inset 0 0 0 1px #9cff9c}.atk{box-shadow:inset 0 0 0 1px #ff8080}
.card{background:linear-gradient(#2d2116,#120d08);border:1px solid #6f5426;border-radius:6px;padding:8px;margin-bottom:8px}
.t{color:#d6b45a;font-weight:bold;margin-bottom:6px;border-bottom:1px solid #6f5426;padding-bottom:4px}
button,select{width:100%;margin-top:6px;padding:8px;background:linear-gradient(#4b3924,#1a120b);color:#f2e6c8;border:1px solid #d6b45a;border-radius:4px;cursor:pointer;font-weight:bold;box-sizing:border-box}
button:hover{filter:brightness(1.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.small{font-size:12px;color:#c7b28a}
.log{border-bottom:1px solid #3a2b18;padding:4px 0}
.fx{animation:fx .25s 4}
@keyframes fx{0%{background:#ff5722}100%{opacity:.35}}
</style>
</head>

<body>
<div id="title">
  <div id="box">
    <h1>三國志11 Web 類PK v15</h1>
    <p>建設區塊｜城內任務｜劇本年份｜200武將｜自選勢力</p>

    <div class="card">
      <div class="t">劇本</div>
      <select id="sc" onchange="opts()">
        <option value="184">184 黃巾之亂</option>
        <option value="200">200 官渡之戰</option>
        <option value="208">208 赤壁之戰</option>
        <option value="220">220 三國鼎立</option>
      </select>
    </div>

    <div class="card">
      <div class="t">選勢力</div>
      <select id="pfSel"></select>
    </div>

    <button onclick="start()">開始遊戲</button>
    <button onclick="loadTitle()">讀取存檔</button>
    <p class="small">右鍵取消。只能控制自己選的勢力；其他勢力由 AI 行動。</p>
  </div>
</div>

<div id="top">
  <span id="turnT">回合1</span>
  <span id="yearT">184年</span>
  <span id="facT">勢力</span>
  <span id="resT">資源</span>
  <span id="modeT">待機</span>
</div>

<div id="game">
  <div id="l">
    <div class="card">
      <div class="t">勢力情報</div>
      <div id="fi"></div>
    </div>

    <div class="card">
      <div class="t">選取情報</div>
      <div id="info">請開始遊戲</div>
    </div>

    <div class="card">
      <div class="t">城內任務</div>
      <div id="tasks"></div>
    </div>

    <div class="card small">
      <div class="t">說明書</div>
      選我方武將可移動 / 攻擊 / 待機。選我方城池可開發、建設、徵兵、派任務。
      外圈「□」為真正可建設區塊。武將派任務後會從地圖消失，每回合產出內政收益。
    </div>
  </div>

  <div id="wrap">
    <div id="map" oncontextmenu="cancel(event)"></div>
  </div>

  <div id="r">
    <div class="card">
      <div class="t">部隊指令</div>
      <div class="grid">
        <button onclick="setM('move')">移動</button>
        <button onclick="setM('attack')">攻擊</button>
      </div>

      <select id="tac">
        <option value="normal">普通攻擊</option>
        <option value="charge">騎兵突擊</option>
        <option value="arrow">弓兵齊射</option>
        <option value="fire">火計</option>
        <option value="confuse">擾亂</option>
      </select>

      <select id="form" onchange="changeForm()">
        <option value="normal">普通陣</option>
        <option value="square">方陣：防禦</option>
        <option value="wedge">鋒矢：騎兵</option>
        <option value="arrow">雁行：弓兵</option>
      </select>

      <button onclick="waitU()">待機</button>
    </div>

    <div class="card">
      <div class="t">都市 / 港關 / 建設</div>
      <button onclick="dev('farm')">開發農業 金-300</button>
      <button onclick="dev('market')">開發商業 金-300</button>
      <button onclick="dev('barrack')">開發兵舍 金-300</button>

      <select id="ft">
        <option>市場</option>
        <option>農場</option>
        <option>兵舍</option>
        <option>鍛冶</option>
        <option>軍樂台</option>
        <option>火球</option>
      </select>

      <button onclick="build()">建設設施 金-400</button>
      <button onclick="weapon('spear')">生產槍兵裝 金-200</button>
      <button onclick="weapon('horse')">生產騎兵裝 金-300</button>
      <button onclick="weapon('bow')">生產弓兵裝 金-250</button>
      <button onclick="recruit()">徵兵 糧-300</button>
      <button onclick="repair()">修復耐久 金-200</button>
    </div>

    <div class="card">
      <div class="t">武將 / 任務 / 外交</div>

      <select id="taskSel">
        <option value="farm">農業任務</option>
        <option value="market">商業任務</option>
        <option value="barrack">兵舍任務</option>
        <option value="tech">技巧任務</option>
      </select>

      <button onclick="assign()">派選取武將入城任務</button>
      <button onclick="recall()">召回城內武將</button>
      <button onclick="search()">搜索在野武將 金-150</button>
      <button onclick="reward()">賞賜忠誠 金-200</button>
      <button onclick="hire()">登用低忠敵將 金-300</button>
      <button onclick="tech()">技巧研究 技巧-120</button>

      <select id="dipTarget"></select>
      <button onclick="dip('alliance')">同盟談判 金-500</button>
      <button onclick="dip('truce')">停戰談判 金-300</button>
    </div>

    <div class="card">
      <div class="grid">
        <button onclick="save()">存檔</button>
        <button onclick="load()">讀檔</button>
      </div>
      <button onclick="endTurn()">結束回合</button>
    </div>

    <div class="card">
      <div class="t">戰報</div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const S=76;

const NAMES=`劉備 關羽 張飛 諸葛亮 趙雲 馬超 黃忠 魏延 龐統 法正 姜維 關平 關興 張苞 馬岱 嚴顏 廖化 糜竺 孫乾 簡雍 曹操 曹丕 曹仁 曹洪 夏侯惇 夏侯淵 張遼 張郃 徐晃 于禁 樂進 典韋 許褚 郭嘉 荀彧 荀攸 程昱 賈詡 司馬懿 曹真 曹休 鄧艾 鍾會 王雙 滿寵 李典 文聘 龐德 孫權 孫策 孫堅 周瑜 魯肅 呂蒙 陸遜 陸抗 太史慈 甘寧 凌統 黃蓋 程普 韓當 周泰 蔣欽 丁奉 朱然 朱桓 徐盛 潘璋 虞翻 張昭 張紘 袁紹 袁譚 袁熙 袁尚 顏良 文醜 田豐 沮授 審配 逢紀 郭圖 高覽 張燕 公孫瓚 公孫度 公孫康 田楷 嚴綱 馬騰 韓遂 馬休 馬鐵 閻行 董卓 呂布 貂蟬 李儒 華雄 李傕 郭汜 張濟 樊稠 高順 陳宮 臧霸 侯成 魏續 宋憲 陶謙 劉表 劉琦 劉琮 蔡瑁 蒯越 蒯良 黃祖 劉璋 張任 黃權 張松 吳懿 李嚴 孟達 劉焉 士燮 士壹 士匡 張魯 閻圃 楊任 楊昂 張角 張寶 張梁 管亥 波才 何進 皇甫嵩 朱儁 盧植 王允 孔融 孔伷 劉繇 王朗 嚴白虎 劉度 趙範 韓玄 金旋 孟獲 祝融 朵思大王 木鹿大王 兀突骨 沙摩柯 司馬師 司馬昭 王元姬 羊祜 杜預 陳泰 郭淮 郝昭 曹彰 曹植 曹叡 曹爽 蔣琬 費禕 董允 馬良 馬謖 王平 張翼 張嶷 吳班 傅士仁 潘濬 諸葛瑾 諸葛恪 孫魯班 孫尚香 孫登 孫和 全琮 呂岱 賀齊 留贊 文鴦 諸葛誕 毌丘儉 王凌 公孫淵 田疇 張繡 賈逵 韓浩 劉曄 張昭 張承 顧雍 步騭 陳武 董襲`.split(' ');

const CITYDATA=[
['襄平','公孫瓚',58,8],['北平','公孫瓚',52,12],['薊','袁紹',47,15],['南皮','袁紹',41,19],
['平原','袁紹',38,23],['鄴','袁紹',34,22],['晉陽','袁紹',26,20],
['洛陽','曹操',28,29],['許昌','曹操',32,33],['陳留','曹操',35,31],['汝南','曹操',37,36],
['濮陽','曹操',40,32],['下邳','曹操',44,36],['小沛','曹操',41,39],['壽春','曹操',48,42],
['武威','馬騰',8,16],['西平','馬騰',12,20],['天水','馬騰',16,24],['安定','馬騰',19,26],
['長安','曹操',23,30],['漢中','張魯',19,39],['梓潼','劉璋',15,45],['成都','劉璋',12,50],
['江州','劉璋',18,53],['永安','劉璋',25,53],['建寧','劉璋',15,61],['雲南','劉璋',10,66],
['宛','曹操',31,42],['新野','劉表',34,46],['襄陽','劉表',37,48],['江陵','劉表',39,52],
['江夏','劉表',43,50],['武陵','劉表',40,59],['長沙','劉表',44,61],['零陵','劉表',41,65],
['桂陽','劉表',46,66],['廬江','孫權',52,48],['柴桑','孫權',56,52],['建業','孫權',60,47],
['吳','孫權',65,51],['會稽','孫權',67,58],['交趾','士燮',53,70]
];

const OV={
劉備:[78,82,85],關羽:[97,74,95],張飛:[98,36,88],諸葛亮:[38,100,96],趙雲:[96,76,92],
馬超:[97,54,90],黃忠:[93,66,86],曹操:[72,94,96],孫權:[70,80,82],周瑜:[78,96,92],
呂布:[100,26,91],司馬懿:[63,98,94],陸遜:[66,95,91],郭嘉:[35,98,84]
};

let ter=[],cells=[],cities=[],zones=[],facs=[],units=[],free=[];
let factions={},rel={};
let player='劉備',yr=184,turn=1,uid=1;
let sel=null,selCity=null,mode=null;
let reach=new Set(),atk=new Set();
let ended=false;

function opts(){
  let y=sc.value;
  let arr=y==='220'
    ?['蜀','魏','吳']
    :y==='208'
      ?['劉備','曹操','孫權']
      :['劉備','曹操','孫權','袁紹','馬騰','公孫瓚','劉表','劉璋','張魯','士燮'];

  pfSel.innerHTML=arr.map(x=>`<option>${x}</option>`).join('');
}
opts();

function hero(n){
  let s=OV[n]||[
    45+Math.random()*45|0,
    45+Math.random()*45|0,
    45+Math.random()*45|0
  ];

  return {
    name:n,
    war:s[0],
    int:s[1],
    lead:s[2],
    loyalty:70+Math.random()*25|0,
    skill:s[1]>=92?'神算':s[0]>=94?'猛將':s[2]>=90?'統率':['奮戰','火計','智將','強襲'][Math.random()*4|0]
  };
}

function start(){
  title.style.display='none';
  yr=+sc.value;
  player=pfSel.value;
  init();
}

function mkMap(){
  map.innerHTML='';
  cells=[];

  for(let i=0;i<S*S;i++){
    let d=document.createElement('div');
    d.className='c plain';
    d.onclick=()=>click(i%S,i/S|0);
    map.appendChild(d);
    cells.push(d);
  }
}

function init(){
  mkMap();
  ter=[];cities=[];zones=[];facs=[];units=[];free=[];
  sel=null;selCity=null;uid=1;turn=1;ended=false;

  genTer();
  setupFactions();
  setupCities();
  normalize();
  makeZones();
  makeRoads();
  seedHeroes();

  log(`${yr} 年劇本開始。玩家勢力：${player}。武將資料 ${NAMES.length} 名。`);
  render();
}

function genTer(){
  for(let y=0;y<S;y++){
    for(let x=0;x<S;x++){
      let t='plain';
      let r=Math.random();

      if(y>10&&y<14&&x>8&&x<62)t='river';
      else if(x>59&&y>20&&y<63)t='river';
      else if(r>.91)t='mountain';
      else if(r>.77)t='forest';

      ter[y*S+x]=t;
    }
  }
}

function setupFactions(){
  let arr=yr===220
    ?['蜀','魏','吳']
    :yr===208
      ?['劉備','曹操','孫權']
      :['劉備','曹操','孫權','袁紹','馬騰','公孫瓚','劉表','劉璋','張魯','士燮'];

  factions={};

  arr.forEach(x=>{
    factions[x]={
      gold:2500,
      food:5000,
      tp:160,
      tech:[],
      weapons:{spear:1200,horse:800,bow:900}
    };
  });

  rel={};

  arr.forEach(a=>{
    rel[a]={};
    arr.forEach(b=>{
      rel[a][b]=a===b?'self':'war';
    });
  });
}

function owner(o){
  if(yr===220){
    return ['劉備','劉璋','張魯'].includes(o)?'蜀':o==='孫權'?'吳':'魏';
  }

  if(yr===208){
    return o==='孫權'||o==='劉備'||o==='曹操'?o:o==='劉表'?'劉備':'曹操';
  }

  if(yr===200&&['董卓','呂布'].includes(o))return'曹操';

  return factions[o]?o:'曹操';
}

function setupCities(){
  CITYDATA.forEach(c=>base(c[2],c[3],c[0],owner(c[1]),'city'));

  [
    ['潼關','曹操',26,31],
    ['虎牢關','曹操',30,28],
    ['陽平關','張魯',20,36],
    ['樊城','曹操',35,45],
    ['江夏港','劉表',44,51],
    ['柴桑港','孫權',56,53],
    ['建業港','孫權',60,49],
    ['壽春港','曹操',49,43]
  ].forEach(c=>base(c[2],c[3],c[0],owner(c[1]),c[0].includes('港')?'port':'gate'));
}

function base(x,y,name,owner,type){
  cities.push({
    x,y,name,owner,type,
    hp:type==='city'?4500:3500,
    maxHp:type==='city'?4500:3500,
    farm:50,
    market:50,
    barrack:50,
    order:80,
    troops:1600,
    facilities:[],
    tasks:{farm:[],market:[],barrack:[],tech:[]}
  });
}

function normalize(){
  cities.forEach(b=>{
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        if(inm(b.x+dx,b.y+dy)){
          ter[(b.y+dy)*S+b.x+dx]='plain';
        }
      }
    }
  });
}

function makeZones(){
  cities.filter(c=>c.type==='city').forEach(b=>{
    [[2,0],[-2,0],[0,2],[0,-2],[2,1],[-2,1],[1,2],[-1,2]].forEach((d,i)=>{
      let x=b.x+d[0],y=b.y+d[1];
      if(inm(x,y)&&!['river','mountain'].includes(gt(x,y))){
        zones.push({x,y,city:b.name,slot:i,facility:null});
      }
    });
  });
}

function makeRoads(){
  for(let i=1;i<cities.length;i++){
    road(cities[i-1].x,cities[i-1].y,cities[i].x,cities[i].y);
  }
}

function road(x,y,x2,y2){
  while(x!==x2){
    ter[y*S+x]='road';
    x+=Math.sign(x2-x);
  }

  while(y!==y2){
    ter[y*S+x]='road';
    y+=Math.sign(y2-y);
  }
}

function seedHeroes(){
  let used=new Set();

  Object.keys(factions).forEach(f=>{
    let home=cities.find(c=>c.owner===f);

    NAMES.filter(n=>!used.has(n)).slice(0,10).forEach((n,i)=>{
      used.add(n);
      let p=adj(home.x,home.y)||home;
      add(hero(n),f,p.x,p.y,i%3===1?'cavalry':i%3===2?'archer':'infantry');
    });
  });

  free=NAMES.filter(n=>!used.has(n)).map(hero);
}

function add(h,f,x,y,type){
  units.push({
    id:uid++,
    ...h,
    faction:f,
    x,y,type,
    hp:2300,
    maxHp:2300,
    speed:type==='cavalry'?7:type==='archer'?5:6,
    range:type==='archer'?4:1,
    formation:'normal',
    acted:false,
    moved:false,
    confused:false,
    task:null,
    city:null
  });
}

function inm(x,y){return x>=0&&x<S&&y>=0&&y<S}
function gt(x,y){return inm(x,y)?ter[y*S+x]:'mountain'}

function can(x,y){
  return inm(x,y)
    &&!['mountain','river'].includes(gt(x,y))
    &&!units.some(u=>!u.task&&u.x===x&&u.y===y&&u.hp>0);
}

function cost(u,x,y){
  let t=gt(x,y);

  if(['mountain','river'].includes(t))return 99;
  if(t==='road')return 1;
  if(t==='forest')return u.type==='cavalry'?3:2;

  return 1;
}

function dist(a,b){
  return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
}

function enemy(a,b){
  return rel[a]?.[b]==='war';
}

function click(x,y){
  if(ended)return;

  let u=units.find(v=>!v.task&&v.x===x&&v.y===y&&v.hp>0);
  let b=cities.find(c=>c.x===x&&c.y===y);
  let z=zones.find(z=>z.x===x&&z.y===y);
  let fc=facs.find(f=>f.x===x&&f.y===y);

  if(!mode){
    if(u){
      sel=u.id;
      selCity=null;
      u.faction===player?showU(u):showEU(u);
      render();
      return;
    }

    if(b){
      sel=null;
      selCity=b.name;
      showB(b);
      render();
      return;
    }

    if(z){
      sel=null;
      selCity=z.city;
      info.innerHTML=`<b>建設區塊</b><br>${z.city}｜${z.facility||'空地'}`;
      render();
      return;
    }

    if(fc){
      info.innerHTML=`<b>${fc.type}</b><br>${fc.city}`;
      render();
      return;
    }
  }

  let a=units.find(v=>v.id===sel);

  if(!a||a.faction!==player){
    cancel();
    return;
  }

  if(mode==='move'){
    if(!reach.has(`${x},${y}`)){
      cancel();
      return;
    }

    a.x=x;
    a.y=y;
    a.moved=true;
    clear();
    mode=null;
    log(`${a.name} 移動。`);
  }

  else if(mode==='attack'){
    if(!atk.has(`${x},${y}`)){
      cancel();
      return;
    }

    let tactic=tac.value;

    if(u&&u.faction!==a.faction&&enemy(a.faction,u.faction)){
      battle(a,u,tactic,x,y);
      a.acted=true;
      a.moved=true;
    }

    else if(b&&b.owner!==a.faction&&enemy(a.faction,b.owner)){
      siege(a,b,tactic);
      a.acted=true;
      a.moved=true;
    }

    else{
      log('不是敵方目標。');
    }

    mode=null;
    clear();
  }

  dead();
  over();
  render();
  showU(a);
}

function setM(v){
  mode=v;
  clear();

  let u=units.find(x=>x.id===sel);

  if(!u||u.faction!==player){
    log('請選我方部隊。');
    return;
  }

  if(v==='move')reachCalc(u);
  if(v==='attack')atkCalc(u);

  render();
}

function reachCalc(u){
  let q=[{x:u.x,y:u.y,c:0}];
  let best=new Map([[`${u.x},${u.y}`,0]]);

  reach.add(`${u.x},${u.y}`);

  while(q.length){
    q.sort((a,b)=>a.c-b.c);
    let p=q.shift();

    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      let x=p.x+d[0];
      let y=p.y+d[1];
      let k=`${x},${y}`;
      let nc=p.c+cost(u,x,y);

      if(can(x,y)&&nc<=u.speed&&(!best.has(k)||nc<best.get(k))){
        best.set(k,nc);
        reach.add(k);
        q.push({x,y,c:nc});
      }
    });
  }
}

function atkCalc(u){
  for(let y=Math.max(0,u.y-u.range);y<=Math.min(S-1,u.y+u.range);y++){
    for(let x=Math.max(0,u.x-u.range);x<=Math.min(S-1,u.x+u.range);x++){
      if(Math.abs(u.x-x)+Math.abs(u.y-y)<=u.range){
        atk.add(`${x},${y}`);
      }
    }
  }
}

function battle(a,t,tactic,x,y){
  let d=a.war;

  if(tactic==='charge'){
    if(a.type!=='cavalry')return log('非騎兵不可突擊。');
    d*=1.8;
  }

  if(tactic==='arrow'){
    if(a.type!=='archer')return log('非弓兵不可齊射。');
    d*=1.7;
  }

  if(tactic==='fire'){
    if(gt(x,y)==='river')return log('水上火計無效。');

    d=a.int*5*(gt(x,y)==='forest'?2:1);
    cells[y*S+x].classList.add('fx');
    setTimeout(()=>cells[y*S+x].classList.remove('fx'),500);
  }

  if(tactic==='confuse'){
    if(a.int+Math.random()*30>t.int+Math.random()*30){
      t.confused=true;
      log(`${t.name} 混亂。`);
    }else{
      log('擾亂失敗。');
    }
    return;
  }

  if(t.formation==='square')d*=.7;

  t.hp=Math.max(0,t.hp-d|0);
  log(`${a.name} 攻擊 ${t.name}，傷害 ${d|0}。`);
}

function siege(a,b,tactic){
  let d=a.lead*5+a.war*5;

  if(tactic==='fire')d+=a.int*4;

  b.hp=Math.max(0,b.hp-d|0);
  log(`${a.name} 攻城 ${b.name} -${d|0}`);

  if(b.hp<=0){
    b.owner=a.faction;
    b.hp=b.maxHp;
    log(`${b.name} 被 ${a.faction} 佔領。`);
  }
}

function ownB(){
  let b=cities.find(c=>c.name===selCity)||cities.find(c=>c.owner===player);

  if(!b||b.owner!==player){
    log('請選我方據點。');
    return null;
  }

  return b;
}

function dev(t){
  let b=ownB();
  let f=factions[player];

  if(!b||f.gold<300)return log('金不足或未選城。');

  f.gold-=300;
  b[t]+=10;

  showB(b);
  render();
}

function build(){
  let b=ownB();
  let f=factions[player];

  if(!b||f.gold<400)return log('金不足。');

  let z=zones.find(z=>z.city===b.name&&!z.facility);

  if(!z)return log('無空建設區。');

  let type=ft.value;

  f.gold-=400;
  z.facility=type;
  b.facilities.push(type);
  facs.push({x:z.x,y:z.y,city:b.name,owner:player,type});

  log(`${b.name} 建設 ${type}。`);
  showB(b);
  render();
}

function weapon(t){
  let b=ownB();
  let f=factions[player];
  let c={spear:200,horse:300,bow:250}[t];

  if(!b||f.gold<c)return log('金不足。');

  f.gold-=c;
  f.weapons[t]+=t==='horse'?300:400;

  render();
}

function recruit(){
  let b=ownB();
  let f=factions[player];

  if(!b||f.food<300)return log('糧不足。');

  f.food-=300;
  b.troops+=500;

  let p=adj(b.x,b.y)||b;
  add(hero('新軍'+uid),player,p.x,p.y,'infantry');

  render();
  showB(b);
}

function repair(){
  let b=ownB();
  let f=factions[player];

  if(!b||f.gold<200)return log('金不足。');

  f.gold-=200;
  b.hp=Math.min(b.maxHp,b.hp+800);

  render();
  showB(b);
}

function assign(){
  let u=units.find(x=>x.id===sel);
  let b=ownB();

  if(!u||!b||u.faction!==player)return log('請選我方武將與城。');
  if(dist(u,b)>2)return log('需在城池2格內。');

  let t=taskSel.value;

  u.task=t;
  u.city=b.name;
  b.tasks[t].push(u.id);

  log(`${u.name} 入城執行任務。`);
  cancel();
}

function recall(){
  let b=ownB();

  if(!b)return;

  let all=[...b.tasks.farm,...b.tasks.market,...b.tasks.barrack,...b.tasks.tech];
  let id=all[0];

  if(!id)return log('無任務武將。');

  let u=units.find(x=>x.id===id);
  let p=adj(b.x,b.y)||b;

  Object.keys(b.tasks).forEach(k=>{
    b.tasks[k]=b.tasks[k].filter(v=>v!==id);
  });

  u.task=null;
  u.city=null;
  u.x=p.x;
  u.y=p.y;

  render();
  showB(b);
}

function search(){
  let b=ownB();
  let f=factions[player];

  if(!b||f.gold<150||!free.length)return log('不能搜索。');

  f.gold-=150;

  let H=free.shift();
  let p=adj(b.x,b.y)||b;

  add(H,player,p.x,p.y,'infantry');

  log(`搜索成功：${H.name}`);
  render();
}

function reward(){
  let u=units.find(x=>x.id===sel);
  let f=factions[player];

  if(!u||u.faction!==player||f.gold<200)return log('不能賞賜。');

  f.gold-=200;
  u.loyalty=Math.min(100,u.loyalty+10);

  showU(u);
  render();
}

function hire(){
  let f=factions[player];
  let u=units.find(x=>x.faction!==player&&x.loyalty<85);

  if(!u||f.gold<300)return log('沒有可登用目標或金不足。');

  f.gold-=300;

  if(Math.random()*100<120-u.loyalty){
    u.faction=player;
    u.loyalty=75;
    log(`登用成功：${u.name}`);
  }else{
    u.loyalty-=5;
    log('登用失敗。');
  }

  render();
}

function tech(){
  let f=factions[player];
  let list=['騎兵強化','弓兵強化','火攻強化','內政強化','行軍強化'];
  let t=list.find(x=>!f.tech.includes(x));

  if(!t||f.tp<120)return log('技巧不足或已滿。');

  f.tp-=120;
  f.tech.push(t);

  render();
  log(`研究完成：${t}`);
}

function dip(t){
  let tar=dipTarget.value;
  let f=factions[player];
  let c=t==='alliance'?500:300;

  if(!tar||f.gold<c)return log('金不足。');

  f.gold-=c;
  rel[player][tar]=t==='alliance'?'alliance':'neutral';
  rel[tar][player]=rel[player][tar];

  render();
}

function changeForm(){
  let u=units.find(x=>x.id===sel);

  if(u&&u.faction===player){
    u.formation=form.value;
  }

  render();
}

function waitU(){
  let u=units.find(x=>x.id===sel);

  if(u&&u.faction===player){
    u.acted=true;
    render();
  }
}

function endTurn(){
  turn++;

  if(turn%12===1)yr++;

  units.forEach(u=>{
    u.acted=false;
    u.moved=false;

    if(u.confused&&Math.random()<.5){
      u.confused=false;
    }
  });

  cities.forEach(b=>{
    let f=factions[b.owner];

    if(!f)return;

    f.gold+=b.market*5+b.tasks.market.length*70+b.facilities.length*20;
    f.food+=b.farm*7+b.tasks.farm.length*80;
    b.troops+=b.tasks.barrack.length*50;
    f.tp+=(b.market+b.barrack)/40+b.tasks.tech.length*15;
  });

  units.filter(u=>u.faction!==player&&!u.task).forEach(ai);

  dead();
  over();
  cancel();
  render();
}

function ai(u){
  let ts=[
    ...units.filter(v=>!v.task&&v.faction!==u.faction&&enemy(u.faction,v.faction)),
    ...cities.filter(c=>c.owner!==u.faction&&enemy(u.faction,c.owner))
  ];

  if(!ts.length)return;

  ts.sort((a,b)=>dist(u,a)-dist(u,b));

  let t=ts[0];

  if(dist(u,t)<=u.range){
    t.type?siege(u,t,'normal'):battle(u,t,'normal',t.x,t.y);
    return;
  }

  let p=step(u,t);

  u.x=p.x;
  u.y=p.y;

  if(dist(u,t)<=u.range){
    t.type?siege(u,t,'normal'):battle(u,t,'normal',t.x,t.y);
  }
}

function step(u,t){
  let best={x:u.x,y:u.y,d:dist(u,t)};

  [[1,0],[-1,0],[0,1],[0,-1]].forEach(v=>{
    let x=u.x+v[0];
    let y=u.y+v[1];

    if(can(x,y)&&Math.abs(x-t.x)+Math.abs(y-t.y)<best.d){
      best={x,y,d:Math.abs(x-t.x)+Math.abs(y-t.y)};
    }
  });

  return best;
}

function dead(){
  units=units.filter(u=>u.hp>0);
}

function over(){
  let a=[...new Set(cities.map(c=>c.owner))];

  if(a.length===1){
    ended=true;
    log(a[0]+' 統一天下。');
  }
}

function adj(x,y){
  for(let d of [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,-1],[2,0],[-2,0]]){
    let nx=x+d[0];
    let ny=y+d[1];

    if(can(nx,ny))return{x:nx,y:ny};
  }

  return null;
}

function showU(u){
  form.value=u.formation;

  info.innerHTML=`
    <b>${u.name}</b>（${u.faction}）<br>
    兵力:${u.hp|0}/${u.maxHp}｜${u.type}<br>
    武:${u.war} 智:${u.int} 統:${u.lead}<br>
    忠誠:${u.loyalty}｜技能:${u.skill}<br>
    ${u.task?'任務:'+u.task+'@'+u.city:'地圖部隊'}
  `;
}

function showEU(u){
  info.innerHTML=`
    <b>${u.name}</b>（${u.faction}）<br>
    非我方，只能查看<br>
    兵力:${u.hp|0} 忠誠:${u.loyalty}<br>
    武:${u.war} 智:${u.int} 統:${u.lead}
  `;
}

function showB(b){
  selCity=b.name;

  info.innerHTML=`
    <b>${b.name}</b>（${b.owner}）<br>
    ${b.type}｜耐久:${b.hp|0}/${b.maxHp}<br>
    農:${b.farm} 商:${b.market} 兵舍:${b.barrack}<br>
    設施:${b.facilities.join('、')||'無'}<br>
    空建設區:${zones.filter(z=>z.city===b.name&&!z.facility).length}
  `;

  tasks.innerHTML=`
    農業:${b.tasks.farm.map(nm).join('、')||'無'}<br>
    商業:${b.tasks.market.map(nm).join('、')||'無'}<br>
    兵舍:${b.tasks.barrack.map(nm).join('、')||'無'}<br>
    技巧:${b.tasks.tech.map(nm).join('、')||'無'}
  `;
}

function nm(id){
  return units.find(u=>u.id===id)?.name||'?';
}

function clear(){
  reach.clear();
  atk.clear();
}

function cancel(e){
  if(e)e.preventDefault();

  sel=null;
  selCity=null;
  mode=null;
  clear();
  render();
}

function log(s){
  document.getElementById('log').innerHTML=`<div class="log">> ${s}</div>`+document.getElementById('log').innerHTML;
}

function save(){
  localStorage.setItem('s11v15',JSON.stringify({
    ter,cities,zones,facs,units,free,factions,rel,player,yr,turn,uid
  }));

  log('存檔完成。');
}

function load(){
  let d=JSON.parse(localStorage.getItem('s11v15')||'null');

  if(!d)return log('無存檔。');

  ter=d.ter;
  cities=d.cities;
  zones=d.zones;
  facs=d.facs;
  units=d.units;
  free=d.free;
  factions=d.factions;
  rel=d.rel;
  player=d.player;
  yr=d.yr;
  turn=d.turn;
  uid=d.uid;

  mkMap();
  render();
  log('讀檔完成。');
}

function loadTitle(){
  title.style.display='none';
  load();
}

function render(){
  if(!cells.length)return;

  cells.forEach((c,i)=>{
    let x=i%S;
    let y=i/S|0;

    c.className='c '+gt(x,y);
    c.textContent='';

    if(reach.has(`${x},${y}`))c.classList.add('reach');
    if(atk.has(`${x},${y}`))c.classList.add('atk');
  });

  zones.forEach(z=>{
    let e=cells[z.y*S+z.x];

    if(e&&!z.facility){
      e.classList.add('zone');
      e.textContent='□';
    }
  });

  facs.forEach(f=>{
    let e=cells[f.y*S+f.x];

    if(e){
      e.classList.add('fac');
      e.textContent='設';
    }
  });

  cities.forEach(b=>{
    let e=cells[b.y*S+b.x];

    if(e){
      e.classList.add(b.type);
      e.textContent=b.type==='city'?'城':b.type==='port'?'港':'關';
    }
  });

  units.filter(u=>!u.task).forEach(u=>{
    let e=cells[u.y*S+u.x];

    if(e){
      e.textContent='兵';
      e.classList.add(
        u.faction===player?'me':enemy(player,u.faction)?'enemy':'neutral'
      );

      if(u.id===sel)e.classList.add('sel');
      if(u.acted)e.classList.add('done');
    }
  });

  let f=factions[player]||{
    gold:0,food:0,tp:0,weapons:{spear:0,horse:0,bow:0},tech:[]
  };

  turnT.innerText=`回合 ${turn}`;
  yearT.innerText=`${yr} 年`;
  facT.innerText=`勢力：${player}`;
  resT.innerText=`金 ${f.gold|0}｜糧 ${f.food|0}｜技巧 ${f.tp|0}`;
  modeT.innerText=`模式：${mode||'待機'}`;

  fi.innerHTML=`
    據點:${cities.filter(c=>c.owner===player).length}<br>
    地圖部隊:${units.filter(u=>u.faction===player&&!u.task).length}<br>
    城內任務:${units.filter(u=>u.faction===player&&u.task).length}<br>
    槍:${f.weapons.spear} 馬:${f.weapons.horse} 弓:${f.weapons.bow}<br>
    技巧:${f.tech.join('、')||'無'}<br>
    在野:${free.length}
  `;

  dipTarget.innerHTML=Object.keys(factions)
    .filter(x=>x!==player)
    .map(x=>`<option>${x}</option>`)
    .join('');
}
</script>
</body>
